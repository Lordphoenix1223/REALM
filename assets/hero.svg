<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc"><title id="title">REALM — follow the evidence</title><desc id="desc">Experimental tools for inspecting evidence about AI-agent actions. Artifact integrity is distinct from execution authorization.</desc><rect width="1280" height="420" rx="14" fill="#101517"/><g stroke="#22302f" stroke-width="1"><path d="M850 0v420m90-420v420m90-420v420m90-420v420M800 70h480M800 160h480M800 250h480M800 340h480"/></g><g transform="translate(62 43) scale(.85)"><g fill="none" stroke="#7ce0cf" stroke-width="3" stroke-linecap="square"><path d="M17 7H7v30h10M31 7h10v30H31"/><path d="M15 15h18v14H15z"/><path d="M24 7v8m0 14v8"/></g><circle cx="24" cy="7" r="3" fill="#7ce0cf"/><circle cx="24" cy="37" r="3" fill="#7ce0cf"/></g><text x="115" y="73" fill="#edf5f2" font-family="Arial,sans-serif" font-size="29" font-weight="600" letter-spacing="5">REALM</text><text x="64" y="143" fill="#7ce0cf" font-family="monospace" font-size="12" letter-spacing="3">EXPERIMENTAL SYSTEMS RESEARCH</text><text x="60" y="213" fill="#ecf2f2" font-family="Arial,sans-serif" font-size="51" letter-spacing="-2">A claim is a starting point.</text><text x="60" y="276" fill="#7ce0cf" font-family="Arial,sans-serif" font-size="51" letter-spacing="-2">Follow the evidence.</text><text x="64" y="337" fill="#a1acb2" font-family="Arial,sans-serif" font-size="18">Inspect AI-agent evidence. Check the bytes. See the limits.</text><g transform="translate(955 178) scale(3)"><g fill="none" stroke="#7ce0cf" stroke-width="3" stroke-linecap="square"><path d="M17 7H7v30h10M31 7h10v30H31"/><path d="M15 15h18v14H15z"/><path d="M24 7v8m0 14v8"/></g><circle cx="24" cy="7" r="3" fill="#7ce0cf"/><circle cx="24" cy="37" r="3" fill="#7ce0cf"/></g><text x="64" y="389" fill="#859994" font-family="monospace" font-size="11">ARTIFACT INTEGRITY ≠ COMPLETE OBSERVATION ≠ AUTHORIZATION</text></svg>
