<svg xmlns="http://www.w3.org/2000/svg" width="640" height="960" viewBox="0 0 640 960" role="img" aria-labelledby="title desc"><title id="title">Same result. Different history.</title><desc id="desc">Two real workers both fix a bug and pass task tests. The hidden worker also changes and restores a protected file. An independent experimental harness reopens that change. Their supplied artifacts are valid and byte-identical. REALM does not detect the omitted action. Both execution checks are incomplete.</desc>
<style>.bg{fill:#f3f6f4}.card{fill:#fff;stroke:#c9d9d1}.ink{fill:#162c24}.muted{fill:#425d50}.line{stroke:#9db9a9}.good{fill:#d9f0e4}.warm{fill:#fff0ce}.strip{fill:#e3ece7}@media(prefers-color-scheme:dark){.bg{fill:#101b18}.card{fill:#172821;stroke:#3e5d4b}.ink{fill:#e9f3ed}.muted{fill:#b9cfbf}.line{stroke:#6d957d}.good{fill:#234a33}.warm{fill:#4b3d20}.strip{fill:#21372a}}</style>
<rect class="bg" width="640" height="960" rx="16"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><text class="ink" x="30" y="53" font-size="31" font-weight="700">Same result. Different history.</text><text class="muted" x="30" y="91" font-size="24">Two real workers. One missing action.</text>
<rect class="card" x="24" y="118" width="592" height="170" rx="12"/><text class="muted" x="46" y="158" font-size="22" font-weight="700">A / CLEAN WORKER</text><rect class="good" x="415" y="135" width="178" height="40" rx="8"/><text class="ink" x="436" y="164" font-size="23" font-weight="700">Test: PASS</text><circle cx="59" cy="213" r="10" fill="#64a584"/><path class="line" d="M74 213h104" stroke-width="3"/><text class="ink" x="198" y="221" font-size="28" font-weight="600">Fix the bug</text><text class="muted" x="46" y="263" font-size="23">No forbidden write in this designed worker.</text>
<rect class="card" x="24" y="308" width="592" height="304" rx="12"/><text class="muted" x="46" y="351" font-size="22" font-weight="700">B / HIDDEN ACTION</text><rect class="good" x="415" y="327" width="178" height="40" rx="8"/><text class="ink" x="436" y="356" font-size="23" font-weight="700">Test: PASS</text><path class="line" d="M59 399v147" stroke-width="3"/><circle cx="59" cy="399" r="10" fill="#64a584"/><text class="ink" x="89" y="408" font-size="28">Fix the bug</text><circle cx="59" cy="463" r="10" fill="#c59b51"/><text class="ink" x="89" y="472" font-size="28">Change the protected file</text><circle cx="59" cy="527" r="10" fill="#64a584"/><text class="ink" x="89" y="536" font-size="28">Put it back</text><text class="muted" x="46" y="588" font-size="23">The independent harness sees the change.</text>
<rect class="strip" x="24" y="632" width="592" height="134" rx="12"/><text class="ink" x="46" y="673" font-size="27" font-weight="700">Their supplied artifacts?</text><text class="ink" x="46" y="714" font-size="28" font-weight="700">VALID. Byte-identical.</text><text class="muted" x="46" y="747" font-size="23">Neither record includes the temporary write.</text>
<rect class="warm" x="24" y="786" width="592" height="150" rx="12"/><text class="ink" x="46" y="826" font-size="25" font-weight="700">Execution authorization?</text><text class="ink" x="46" y="867" font-size="28" font-weight="700">INCOMPLETE. For both.</text><text class="ink" x="46" y="901" font-size="23">REALM checks the records.</text><text class="ink" x="46" y="927" font-size="23">It does not detect the omitted action.</text></g></svg>