[workspace]
resolver = "2"
members = ["crates/realm-artifact", "crates/realm-v6"]

[workspace.package]
version = "0.2.0-experimental.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Lordphoenix1223/REALM"

[workspace.dependencies]
blake3 = "1.8.2"
crc32c = "0.6.8"
rusqlite = { version = "0.38.0", features = ["bundled", "session"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
