[workspace]
resolver = "2"
members = [
    "crates/realm-core",
    "crates/realm-cas",
    "crates/realm-ledger",
    "crates/realm-capture",
    "crates/realm-capture-macos",
    "crates/realm-admission",
    "crates/realm-objects",
    "crates/realm-contract",
    "crates/realm-recovery",
    "crates/realm-verify",
    "crates/realm-lab",
    "crates/realm-provenance",
    "crates/realm-cli",
    "crates/realm-world",
    "crates/realm-history",
    "crates/realm-agent",
    "crates/realm-history-bench",
    "crates/realm-rewrite",
    "crates/realm-v6",
    "crates/realm-artifact",
]

[workspace.package]
version = "0.7.0-experimental.1"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Lordphoenix1223/REALM"

[workspace.dependencies]
blake3 = "1.8.2"
crc32c = "0.6.8"
rusqlite = { version = "0.38.0", features = ["bundled", "session"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
