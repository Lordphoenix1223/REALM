[package]
name = "realm-artifact"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-support = ["realm-v6/test-support"]
race-test-hooks = []
# Explicitly non-authorizing disposable receiver harness, absent from default builds.
receiver-fixtures = []

[dependencies]
blake3.workspace = true
libc = "0.2"
realm-v6 = { path = "../realm-v6" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
realm-v6 = { path = "../realm-v6", features = ["test-support"] }

[[example]]
name = "installed_authority_receiver_fixture"
required-features = ["receiver-fixtures"]
