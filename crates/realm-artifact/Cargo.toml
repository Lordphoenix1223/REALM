[package]
autobins = false
name = "realm-artifact"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
test-support = ["realm-v6/test-support"]
race-test-hooks = []

[dependencies]
blake3.workspace = true
libc = "0.2"
realm-v6 = { path = "../realm-v6" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
realm-v6 = { path = "../realm-v6", features = ["test-support"] }

[[bin]]
name = "realm-artifact"
path = "src/bin/realm-artifact.rs"
